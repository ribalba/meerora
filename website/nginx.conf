# The meerora website. Coolify's proxy terminates TLS and forwards plain HTTP
# to port 80 of this container.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # `expires` sets Cache-Control without add_header, so these headers stay on every location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self' https://umami.meerora.com; connect-src 'self' https://umami.meerora.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # The video streams in ranges, which nginx serves for static files on its own.
    location /media/ {
        expires 7d;
    }

    location ~ ^/(fonts|icons)/ {
        expires 30d;
    }

    # The install script (website/README.md) is plain text, so a browser shows it and
    # curl pipes it into sh as it is. It is never cached, so a fix reaches everyone at once.
    location = /install.sh {
        types { }
        default_type text/plain;
        charset_types text/plain;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
